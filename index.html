<meta property="og:title" content="Sena Şener — Aşkından Ölmemeli">
<meta property="og:description" content="Yeni albüm · 07.08.2026">

<style>
@font-face{
  font-family:'Volina';
  src:url('assets/fonts/Volina.woff2') format('woff2'),
      url('assets/fonts/Volina.otf') format('opentype');
  font-weight:normal;font-style:normal;font-display:swap;
}
:root{
  --ink:#241309; --deep:#160c05;
  --amber:#ee8a1f; --amber-soft:#f5a94f;
  --cream:#f4e5c3; --cream-dim:#cfb589;
  --rust:#a44514; --logo-brown:#3f170f;
  --line:rgba(244,229,195,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:var(--ink); color:var(--cream);
  font-family:'Archivo',sans-serif;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:2500;
  background-image:radial-gradient(rgba(244,229,195,.05) 1px, transparent 1px);
  background-size:4px 4px; mix-blend-mode:overlay;
}
::selection{background:var(--amber);color:var(--ink)}
a{color:inherit}

/* ---------- stage ---------- */
.hero{
  height:100svh;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:24px 20px clamp(140px,30vh,300px);overflow:hidden;
}
.hero-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-bg::before{ /* ambient glow behind the video */
  content:"";position:absolute;inset:-10%;
  background:
    radial-gradient(46% 62% at 50% 46%, rgba(238,138,31,.16), transparent 70%),
    radial-gradient(70% 90% at 50% 50%, rgba(63,23,15,.5), transparent 75%);
}
.hero-bg video{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  height:100%;width:min(100vw,118vh);
  object-fit:cover;object-position:center 30%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 42%, rgba(22,12,5,.18), rgba(22,12,5,.7) 82%),
    linear-gradient(rgba(22,12,5,.28), rgba(36,19,9,.14) 45%, rgba(36,19,9,.5) 100%);
}

/* ---------- vinyl (anchored low) ---------- */
.hero-record-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;z-index:1;pointer-events:none}
.hero-record{
  width:min(66vh,88vw);aspect-ratio:1;border-radius:50%;position:relative;
  transform:translateY(28%);
  filter:drop-shadow(0 40px 90px rgba(0,0,0,.65));
}
.hero-record .disc{position:absolute;inset:0;border-radius:50%}
.hero-record .grooves{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle, transparent 0 33%, rgba(13,7,3,.66) 33.5% 100%),
    repeating-radial-gradient(circle, rgba(244,229,195,.06) 0 1.5px, transparent 1.5px 7px);
  backdrop-filter:blur(1.5px) saturate(.9);
}
.hero-record .hr-label{
  position:absolute;inset:33%;border-radius:50%;overflow:hidden;
  border:4px solid var(--amber);background:var(--logo-brown);
  box-shadow:0 0 0 3px #0d0703, inset 0 0 34px rgba(0,0,0,.35);
}
.hr-label img{width:100%;height:100%;display:block;transform:scale(1.02)}
.spin{animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- content ---------- */
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,26px)}
.hero-eyebrow{font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);text-shadow:0 2px 14px rgba(0,0,0,.6)}
h1.title{
  font-family:'Volina','Shrikhand',cursive;font-weight:400;line-height:1.05;
  font-size:clamp(1.9rem,6.4vw,4.6rem);color:var(--cream);white-space:nowrap;
  text-shadow:.05em .05em 0 var(--rust), 0 12px 32px rgba(0,0,0,.6);
}

.cd{display:flex;gap:clamp(10px,3vw,30px);align-items:flex-start}
.cd-unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.cd-digits{
  display:flex;gap:3px;font-family:'Space Mono',monospace;font-weight:700;
  font-size:clamp(1.7rem,5.4vw,3.3rem);line-height:1;color:var(--cream);
  background:rgba(22,12,5,.62);border:1px solid var(--line);border-radius:6px;
  padding:11px 11px;backdrop-filter:blur(6px);
}
.digit{height:1em;overflow:hidden}
.strip{display:flex;flex-direction:column;transition:transform .55s cubic-bezier(.25,.9,.25,1)}
.strip span{height:1em}
.cd-lbl{font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:var(--cream-dim)}
.cd-sep{font-family:'Shrikhand',cursive;font-size:clamp(1.4rem,4vw,2.4rem);color:var(--amber);padding-top:12px}

.etch{
  font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;
  color:var(--cream);transform:rotate(-1.2deg);text-shadow:0 2px 12px rgba(0,0,0,.7);
}
.presave{
  display:inline-block;text-decoration:none;background:var(--amber);color:var(--ink);
  font-family:'Space Mono',monospace;font-weight:700;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;
  padding:15px 36px;border-radius:3px;box-shadow:0 12px 34px rgba(238,138,31,.35);
  transition:background .2s, box-shadow .2s;
}
.presave:hover{background:var(--amber-soft);box-shadow:0 16px 44px rgba(238,138,31,.5)}
.f-btn{
  font-family:'Space Mono',monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  text-decoration:none;border:1px solid var(--cream-dim);color:var(--cream);
  padding:13px 22px;border-radius:3px;transition:color .2s,border-color .2s;
}
.f-btn:hover{color:var(--amber);border-color:var(--amber)}

/* released state */
.released .cd,.released .pre-only{display:none!important}
.rel-only{display:none}
.released .rel-only{display:inline-flex}
.rel-cta{gap:14px;flex-wrap:wrap;justify-content:center}

@media(prefers-reduced-motion:reduce){
  .spin{animation:none!important}
  .strip{transition:none}
}
@media(max-height:640px){
  .hero{padding-bottom:clamp(90px,22vh,180px)}
  .hero-content{gap:10px}
  h1.title{font-size:clamp(1.7rem,6vh,3.4rem)}
  .cd-digits{font-size:clamp(1.3rem,4.6vh,2.2rem)}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-bg" aria-hidden="true">
    <video id="bgvid" loop playsinline preload="auto" poster="assets/poster.jpg">
      <source src="assets/teaser.mp4" type="video/mp4">
    </video>
  </div>

  <div class="hero-record-wrap" aria-hidden="true">
    <div class="hero-record">
      <div class="disc spin">
        <div class="grooves"></div>
        <div class="hr-label"><img src="assets/logo.png" alt=""></div>
      </div>
    </div>
  </div>

  <div class="hero-content">
    <p class="hero-eyebrow"><span class="pre-only">Yeni albüm</span><span class="rel-only">Albüm yayında</span></p>
    <h1 class="title">Aşkından Ölmemeli</h1>

    <div class="cd" id="cd" aria-label="Geri sayım">
      <div class="cd-unit"><div class="cd-digits" data-u="d"></div><span class="cd-lbl">Gün</span></div>
      <span class="cd-sep">:</span>
      <div class="cd-unit"><div class="cd-digits" data-u="h"></div><span class="cd-lbl">Saat</span></div>
      <span class="cd-sep">:</span>
      <div class="cd-unit"><div class="cd-digits" data-u="m"></div><span class="cd-lbl">Dakika</span></div>
      <span class="cd-sep">:</span>
      <div class="cd-unit"><div class="cd-digits" data-u="s"></div><span class="cd-lbl">Saniye</span></div>
    </div>

    <p class="etch">07 Ağustos 2026</p>

    <div class="rel-only rel-cta">
      <a class="presave" href="https://open.spotify.com/artist/7CW2eGwAuElNq09rVtZYsM" target="_blank" rel="noopener">Şimdi dinle · Spotify</a>
      <a class="f-btn" href="https://music.apple.com/tr/artist/sena-%C5%9Fener/1084577486" target="_blank" rel="noopener">Apple Music</a>
      <a class="f-btn" href="https://www.youtube.com/channel/UCfrpd0imEITLaj1LEnEL1gQ" target="_blank" rel="noopener">YouTube</a>
    </div>
  </div>
</header>

<script>
(function(){
  /* ---------- background video: audio always on ---------- */
  var vid = document.getElementById('bgvid');
  vid.muted = false;
  vid.volume = 1;
  function unlock(){
    vid.muted = false;
    vid.play().catch(function(){});
    ['pointerdown','touchend','keydown'].forEach(function(ev){
      document.removeEventListener(ev, unlock);
    });
  }
  vid.play().catch(function(){
    /* browser blocked sound-on autoplay: start muted, unmute on first interaction */
    vid.muted = true;
    vid.play().catch(function(){});
    ['pointerdown','touchend','keydown'].forEach(function(ev){
      document.addEventListener(ev, unlock, {once:true});
    });
  });

  /* ---------- countdown ---------- */
  var RELEASE = new Date('2026-08-07T00:00:00+03:00').getTime();
  function makeDigits(el, count){
    el.innerHTML = '';
    for(var i = 0; i < count; i++){
      var d = document.createElement('span'); d.className = 'digit';
      var st = document.createElement('span'); st.className = 'strip';
      for(var n = 0; n < 10; n++){ var x = document.createElement('span'); x.textContent = n; st.appendChild(x); }
      d.appendChild(st); el.appendChild(d);
    }
  }
  ['d','h','m','s'].forEach(function(u){ makeDigits(document.querySelector('[data-u="'+u+'"]'), 2); });
  function setUnit(u, val){
    var str = String(val).padStart(2, '0');
    document.querySelectorAll('[data-u="'+u+'"] .strip').forEach(function(st, i){
      st.style.transform = 'translateY(-' + Number(str[i]) + 'em)';
    });
  }
  function tick(){
    var diff = RELEASE - Date.now();
    if(diff <= 0){ document.body.classList.add('released'); return; }
    var s = Math.floor(diff / 1000);
    setUnit('d', Math.floor(s / 86400));
    setUnit('h', Math.floor(s % 86400 / 3600));
    setUnit('m', Math.floor(s % 3600 / 60));
    setUnit('s', s % 60);
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
