<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#27150f">
  <title>Sena Şener — Alışılır mı Aşka</title>
  <meta name="description" content="Sena Şener — Alışılır mı Aşka, 11 Eylül 2026. Şarkı şarkı açılan bir albüm.">
  <meta property="og:title" content="Sena Şener — Alışılır mı Aşka">
  <meta property="og:description" content="Alışılır mı Aşka · 11 Eylül 2026. Şarkı şarkı açılan bir albüm.">
  <meta property="og:image" content="assets/logo.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Volina.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
</head>
<body>
  <div class="stage">
    <div class="hero-film" aria-hidden="true">
      <video id="bgvid" muted loop playsinline preload="none" poster="assets/poster.jpg" tabindex="-1">
        <source src="assets/teaser.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Retained vinyl and artist label, now part of the backdrop rather than another section. -->
    <div class="hero-record" aria-hidden="true">
      <div class="disc">
        <div class="grooves"></div>
        <div class="hr-label"><img src="assets/logo.png" width="800" height="800" alt=""></div>
      </div>
    </div>

    <header class="site-header">
      <p class="wordmark">Sena Şener</p>
    </header>

    <main id="main" class="release" aria-labelledby="release-title">
      <div class="release-content">
        <h1 id="release-title"><span>Alışılır mı</span> <span class="title-last">Aşka</span></h1>

        <div class="release-info">
          <p class="release-status" id="release-status" role="status" aria-live="polite">11 Eylül'de</p>
          <p class="release-date"><time id="release-date" datetime="2026-09-11T00:00:00+03:00">11 Eylül 2026</time><span id="release-time"> · 00.00 (TSİ)</span></p>
        </div>

        <div class="release-action-area">
          <div class="countdown" id="countdown" role="timer" aria-live="off" aria-label="Yayına kalan süre" hidden>
            <div class="countdown-unit" id="countdown-days" hidden><span data-unit="days">00</span><span class="countdown-label">gün</span></div>
            <div class="countdown-unit"><span data-unit="hours">00</span><span class="countdown-label">saat</span></div>
            <span class="countdown-colon" aria-hidden="true">:</span>
            <div class="countdown-unit"><span data-unit="minutes">00</span><span class="countdown-label">dakika</span></div>
            <span class="countdown-colon" aria-hidden="true">:</span>
            <div class="countdown-unit"><span data-unit="seconds">00</span><span class="countdown-label">saniye</span></div>
          </div>

          <a class="artist-link" id="pre-release-link" href="https://open.spotify.com/artist/7CW2eGwAuElNq09rVtZYsM" target="_blank" rel="noopener noreferrer">Spotify'da Sena Şener<span class="sr-only"> — yeni sekmede açılır</span></a>

          <div class="listen-links" id="listen-links" hidden>
            <nav class="platforms" aria-label="Sena Şener — dinleme bağlantıları">
              <a class="platform-primary" href="https://open.spotify.com/artist/7CW2eGwAuElNq09rVtZYsM" target="_blank" rel="noopener noreferrer">Spotify<span class="sr-only"> — Sena Şener, yeni sekmede açılır</span></a>
              <a href="https://music.apple.com/tr/artist/sena-%C5%9Fener/1084577486" target="_blank" rel="noopener noreferrer">Apple Music<span class="sr-only"> — Sena Şener, yeni sekmede açılır</span></a>
              <a href="https://www.youtube.com/channel/UCfrpd0imEITLaj1LEnEL1gQ" target="_blank" rel="noopener noreferrer">YouTube<span class="sr-only"> — Sena Şener, yeni sekmede açılır</span></a>
            </nav>
          </div>
        </div>
      </div>
    </main>

    <footer class="stage-footer">
      <div class="film-controls" id="film-controls" hidden>
        <button id="sound-toggle" type="button" aria-label="Aşkından Ölmemeli videosunun sesi" aria-pressed="false" aria-controls="bgvid">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="sound-off" d="m16 9 6 6m0-6-6 6"/><path class="sound-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
          <span id="sound-label">Sesi aç</span>
        </button>
        <button id="motion-toggle" type="button" aria-label="Aşkından Ölmemeli videosunun oynatımı" aria-pressed="false" aria-controls="bgvid">
          <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="play-symbol" d="m8 5 11 7-11 7V5Z"/><path class="pause-symbol" d="M8 5v14M16 5v14"/></svg>
          <span id="motion-label">Oynat</span>
        </button>
      </div>
      <p class="media-status" id="media-status" role="status" aria-live="polite"></p>
    </footer>
  </div>
</body>
</html>
